[package]
name = "managed-control-core"
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0-only"
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sodiumoxide = "0.2"
sha2 = "0.10"
base64 = "0.22"
uuid = {version = "1", features = ["v4"]}
reqwest = {version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"]}
url = "2"
fs2 = "0.4"
log = "0.4"

[workspace]
