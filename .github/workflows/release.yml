name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      source-url: ${{ steps.config.outputs.source-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate release configuration
        id: config
        env:
          CONTROL_URL: ${{ vars.RUSTDESK_CONTROL_URL || 'https://rustdesk-control.altasci.com' }}
          TAG: ${{ github.ref_name }}
          PUBLIC: ${{ github.event.repository.private == false }}
          SOURCE_URL: ${{ vars.RUSTDESK_MANAGED_SOURCE_URL || 'https://github.com/phil616/rustdesk-control' }}
        run: |
          python3 - <<'PY'
          import os, re, urllib.parse
          if not re.fullmatch(r'v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?', os.environ['TAG']):
              raise SystemExit('Use a version tag such as v1.0.0 or v1.0.0-rc.1')
          url = urllib.parse.urlsplit(os.environ['CONTROL_URL'])
          if url.scheme != 'https' or not url.hostname or url.username or url.password or url.path not in ('', '/') or url.query or url.fragment:
              raise SystemExit('Set repository variable RUSTDESK_CONTROL_URL to a valid HTTPS origin')
          source = urllib.parse.urlsplit(os.environ['SOURCE_URL'])
          if source.scheme != 'https' or not source.hostname or source.username or source.password or source.fragment:
              raise SystemExit('RUSTDESK_MANAGED_SOURCE_URL must be a public HTTPS source URL')
          if os.environ['PUBLIC'] != 'true':
              raise SystemExit('This release workflow requires a public source repository; see docs/LICENSING.md')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source-url=' + os.environ['SOURCE_URL'] + '\n')
          PY

  control-linux-amd64:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and verify Linux amd64 control plane
        run: |
          ./scripts/build.sh
          go test ./...
          go vet ./...
          python3 scripts/test-release.py
          mkdir -p dist/release
          cp bin/rustdesk-control dist/release/rustdesk-control-linux-amd64
          file dist/release/rustdesk-control-linux-amd64 | grep -q 'ELF 64-bit.*x86-64'
      - uses: actions/upload-artifact@v4
        with:
          name: control-linux-amd64
          path: dist/release/rustdesk-control-linux-amd64
          if-no-files-found: error
          retention-days: 7

  client-windows-amd64:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      RUSTDESK_CONTROL_URL: ${{ vars.RUSTDESK_CONTROL_URL || 'https://rustdesk-control.altasci.com' }}
      RUSTDESK_MANAGED_SOURCE_URL: ${{ needs.validate.outputs.source-url }}
      # VS developer-shell setup overwrites VCPKG_ROOT. Keep our checkout separate.
      RDC_VCPKG_ROOT: C:\rdc-vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: '15.0.6'
      - name: Prepare native dependency tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install nasm --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NASM installation failed' }
          'C:\Program Files\NASM' >> $env:GITHUB_PATH
          git clone https://github.com/microsoft/vcpkg.git $env:RDC_VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
          git -C $env:RDC_VCPKG_ROOT checkout 120deac3062162151622ca4860575a33844ba10b
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg checkout failed' }
          & "$env:RDC_VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
      - name: Build Windows x64 managed EXE
        shell: pwsh
        run: |
          ./scripts/build-client.ps1 -VcpkgRoot $env:RDC_VCPKG_ROOT
          New-Item -ItemType Directory -Force dist/release | Out-Null
          Copy-Item dist/windows-x64/rustdesk-managed-1.4.9-x86_64-install.exe dist/release/rustdesk-managed-windows-amd64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: client-windows-amd64
          path: dist/release/rustdesk-managed-windows-amd64.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [control-linux-amd64, client-windows-amd64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-amd64'
          merge-multiple: true
          path: dist/release
      - name: Publish exactly two release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: python3 scripts/publish-release.py
